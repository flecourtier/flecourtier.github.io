
    <!DOCTYPE html>
    <html>
    <head>
    	<title>Leaflet debug page</title>

    	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.css" />
    	<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.0.0-beta.2/leaflet.js"></script>
    	<meta name="viewport" content="width=device-width, initial-scale=1.0">
    	<link rel="stylesheet" href="leaflet_dist/screen.css" />

    	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.css" />
    	<link rel="stylesheet" href="leaflet_dist/MarkerCluster.Default.css" />
    	<script src="leaflet_dist/leaflet.markercluster-src.js"></script>
    	<script src="org-locations.js"></script>

    	<style>
    		html, body {
    			margin: 0;
    			padding: 0;
    			font-family: Arial, sans-serif;
    			height: 100%;
    			width: 100%;
    		}
    		#map {
    			position: absolute;
    			top: 0;
    			bottom: 0;
    			width: 100%;
    			height: 100%;
    		}
    		#controls {
    			position: absolute;
    			top: 10px;
    			left: 10px;
    			background: white;
    			padding: 15px;
    			border-radius: 5px;
    			box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    			z-index: 1000;
    			max-width: 250px;
    		}
    		#controls h3 {
    			margin: 0 0 10px 0;
    			font-size: 16px;
    			border-bottom: 2px solid #ddd;
    			padding-bottom: 8px;
    		}
    		.legend-item {
    			display: flex;
    			align-items: center;
    			margin-bottom: 8px;
    			cursor: pointer;
    		}
    		.legend-color {
    			width: 20px;
    			height: 20px;
    			border-radius: 2px;
    			margin-right: 10px;
    			flex-shrink: 0;
    		}
    		.legend-item input[type="checkbox"] {
    			cursor: pointer;
    			margin-right: 8px;
    		}
    		.legend-label {
    			font-size: 14px;
    			user-select: none;
    		}
    		.talk-color {
    			background-color: #D62828;
    		}
    		.talk-upcoming-color {
    			background-color: #FF8C00;
    		}
    		.poster-color {
    			background-color: #2E5CA6;
    		}
    		.poster-upcoming-color {
    			background-color: #00A896;
    		}
    	</style>

    </head>
    <body>

    	<div id="map"></div>
    	<div id="controls">
    		<h3>Legend</h3>
    		<label class="legend-item">
    			<input type="checkbox" id="showTalks" checked>
    			<div class="legend-color talk-color"></div>
    			<span class="legend-label">Talks</span>
    		</label>
    		<label class="legend-item">
    			<input type="checkbox" id="showTalksUpcoming" checked>
    			<div class="legend-color talk-upcoming-color"></div>
    			<span class="legend-label">Upcoming talks</span>
    		</label>
    		<label class="legend-item">
    			<input type="checkbox" id="showPosters" checked>
    			<div class="legend-color poster-color"></div>
    			<span class="legend-label">Posters</span>
    		</label>
    		<label class="legend-item">
    			<input type="checkbox" id="showPostersUpcoming" checked>
    			<div class="legend-color poster-upcoming-color"></div>
    			<span class="legend-label">Upcoming posters</span>
    		</label>
    	</div>

    	<script type="text/javascript">
		// Check URL parameters first
		var urlParams = new URLSearchParams(window.location.search);
		var hidePoster = urlParams.get('hidePoster') === 'true';
		var hideTalk = urlParams.get('hideTalk') === 'true';
		console.log('hidePoster parameter:', hidePoster);
		console.log('hideTalk parameter:', hideTalk);

		var tiles = L.tileLayer('http://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
              maxZoom: 18,
              attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom, 2012'
                    }),
    			latlng = L.latLng(30, 10);
    		var map = L.map('map', {center: latlng, zoom: 0.7, layers: [tiles]});
    		var markers = L.markerClusterGroup({
    			showCoverageOnHover: false,
    			maxClusterRadius: 80
    			});

    		// Store markers by type for filtering
    		var talkMarkers = [];
    		var talkUpcomingMarkers = [];
    		var posterMarkers = [];
    		var posterUpcomingMarkers = [];

    		// Create markers and store them by type
		for (var i = 0; i < addressPoints.length; i++) {
			var a = addressPoints[i];
			var title = a.description;
			var marker = L.marker(new L.LatLng(a.latitude, a.longitude), {
				title: title,
				icon: L.icon({
					iconUrl: 'data:image/svg+xml;base64,' + btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 25 41"><path fill="' + a.color + '" d="M12.5 0C5.597 0 0 5 0 12.5 0 25 12.5 41 12.5 41s12.5-16 12.5-28.5S19.403 0 12.5 0z" stroke="white" stroke-width="1.5"/><circle cx="12.5" cy="12.5" r="5" fill="white"/></svg>'),
					iconSize: [25, 41],
					iconAnchor: [12.5, 41],
					popupAnchor: [0, -41]
				})
			});
			
			// Create popup content with link
			var popupContent = title;
			if (a.permalink) {
				popupContent = '<a href="' + a.permalink + '" target="_parent" style="color: #0066cc; text-decoration: none;">' + title + ' →</a>';
			}
			marker.bindPopup(popupContent);

			// Add all markers to group first
			markers.addLayer(marker);

			// Store marker reference by type
			if (a.type === 'talk' && !a.upcoming) {
				talkMarkers.push(marker);
			} else if (a.type === 'talk' && a.upcoming) {
				talkUpcomingMarkers.push(marker);
			} else if (a.type === 'poster' && !a.upcoming) {
				posterMarkers.push(marker);
			} else if (a.type === 'poster' && a.upcoming) {
				posterUpcomingMarkers.push(marker);
			}
		}
    		map.addLayer(markers);
    		map.zoomIn();

    		// Apply URL parameter filtering AFTER map is setup
    		setTimeout(function() {
    			if (hidePoster) {
    				document.getElementById('showPosters').checked = false;
    				document.getElementById('showPostersUpcoming').checked = false;
    				posterMarkers.forEach(function(marker) {
    					markers.removeLayer(marker);
    				});
    				posterUpcomingMarkers.forEach(function(marker) {
    					markers.removeLayer(marker);
    				});
    			}
    			if (hideTalk) {
    				document.getElementById('showTalks').checked = false;
    				document.getElementById('showTalksUpcoming').checked = false;
    				talkMarkers.forEach(function(marker) {
    					markers.removeLayer(marker);
    				});
    				talkUpcomingMarkers.forEach(function(marker) {
    					markers.removeLayer(marker);
    				});
    			}
    		}, 100);

    		// Filter functionality
    		function toggleMarkers(markerList, checked) {
    			markerList.forEach(function(marker) {
    				if (checked) {
    					markers.addLayer(marker);
    				} else {
    					markers.removeLayer(marker);
    				}
    			});
    		}

    		document.getElementById('showTalks').addEventListener('change', function() {
    			toggleMarkers(talkMarkers, this.checked);
    		});
    		document.getElementById('showTalksUpcoming').addEventListener('change', function() {
    			toggleMarkers(talkUpcomingMarkers, this.checked);
    		});
    		document.getElementById('showPosters').addEventListener('change', function() {
    			toggleMarkers(posterMarkers, this.checked);
    		});
    		document.getElementById('showPostersUpcoming').addEventListener('change', function() {
    			toggleMarkers(posterUpcomingMarkers, this.checked);
    		});
	</script>
    </body>
    </html>
